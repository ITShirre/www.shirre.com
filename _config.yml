# Website settings
title: Shirre Lab Corp.
description: Shirre
keywords: Shirre,Shirre Company
baseurl:   # if you have suburl as homepage like '/homepage', please change it to '/homepage' and your repo's name should be 'homepage'
#url: https://jarrekk.github.io/Jalpc  # url should be 'http://<github_username>.github.io/homepage' as before
url: https://www.shirre.com

twitter_username: ShirreLabCorp
linkedin_username: shirre-lab-corp

collections:
  products:
    permalink: /products/:products/
  news:
    permalink: /news/:news/
  designs:
    permalink: /designs/:designs/

# Plugins (jekyll-sitemap is supported on GitHub Pages) -> /sitemap.xml
plugins:
  - jekyll-sitemap

# Keep non-pages out of the sitemap
defaults:
  - scope:
      path: "404.html"
    values:
      sitemap: false
  - scope:
      path: "static"
    values:
      sitemap: false

# scss
sass:
  style: compressed

# Build settings
encoding: utf-8

# other settings
highlighter: rouge
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
